<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование таблицы РПЛ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rpl_table.css') }}">
</head>
<body>
    <a href="{{ url_for('home') }}">На главную</a>
    <h1>Редактирование таблицы РПЛ</h1>

    <!-- Кнопка для обновления из API -->
    <div style="margin-bottom: 20px;">
        <form action="{{ url_for('restore_table') }}" method="POST" style="display: inline; margin-left: 10px;">
    <button type="submit" style="background: #ffc107; color: black; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">
        Восстановить таблицу
    </button>
</form>
        <span style="margin-left: 10px; color: #666;">Автоматически обновит таблицу актуальными данными</span>
    </div>

    <form method="POST">
        <table>
            <tr>
                <th>№</th>
                <th>Команда</th>
                <th>И</th>
                <th>В</th>
                <th>Н</th>
                <th>П</th>
                <th>ЗМ</th>
                <th>ПМ</th>
                <th>О</th>
            </tr>
            {% for team in table %}
            <tr>
                <td>{{ team.position }}</td>
                <td><input type="text" name="team[]" value="{{ team.team }}" class="team-name" required></td>
                <td><input type="number" name="matches[]" value="{{ team.matches }}" min="0"></td>
                <td><input type="number" name="wins[]" value="{{ team.wins }}" min="0"></td>
                <td><input type="number" name="draws[]" value="{{ team.draws }}" min="0"></td>
                <td><input type="number" name="losses[]" value="{{ team.losses }}" min="0"></td>
                <td><input type="number" name="goals_for[]" value="{{ team.goals_for }}" min="0"></td>
                <td><input type="number" name="goals_against[]" value="{{ team.goals_against }}" min="0"></td>
                <td><strong>{{ team.points }}</strong></td>
            </tr>
            {% endfor %}
        </table>
        <button type="submit" style="margin-top: 20px;">Сохранить изменения</button>
    </form>
</body>
</html>
