<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Удачи - Фан-сайт РПЛ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wheel.css') }}">
    <style>
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }

        /* Динамические стили для секторов */
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: left bottom;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .wheel-text {
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            white-space: nowrap;
            transform-origin: center;
            text-align: center;
            width: 40px;
        }
    </style>
</head>
<body class="theme-{{ current_user.theme or 'default' }} themed-body"
    {% if current_user.theme =='club' and current_user.club %}
        {% set user_club = clubs|selectattr('name','equalto', current_user.club)|first %}
        {% if user_club %}
            style="--club-color-1: {{ user_club.color1 }}; --club-color-2: {{ user_club.color2 }}; --club-shadow-color: {{ user_club.color1 }}80;"
        {% endif %}
    {% endif %}
>

    <a href="{{ url_for('logout') }}" class="logout-link-fixed">Выйти</a>
    <a href="{{ url_for('home') }}" class="wheel-link-fixed">🏠 На главную</a>

    <div class="debug-info" id="debugInfo">
        Ожидание вращения...
    </div>

    <div class="home-container">
        <div class="page-header">
            <h1>🎡 Колесо Удачи</h1>
            <a href="{{ url_for('profile') }}" class="profile-header-link">
                {% if current_user.avatar %}
                <img src="{{ url_for('uploaded_file', filename=current_user.avatar) }}" class="profile-avatar">
                {% else %}
                <img src="{{ url_for('static', filename='img/default_avatar.png') }}" class="profile-avatar">
                {% endif %}
                <span>Мой профиль</span>
            </a>
        </div>

        <div class="content-card">
            <h2>Испытайте удачу!</h2>
            <p>Крутите колесо и выигрывайте монеты! Можно крутить 1 раз в 24 часа.</p>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="wheel">
                    <!-- Секции колеса будут созданы через JavaScript -->
                </div>
                <div class="wheel-inner" id="wheelInner">
                    <div class="wheel-result-inner" id="wheelResultInner">
                        <span class="wheel-result-large">🎡</span>
                        <span class="wheel-result-small">Колесо Удачи</span>
                    </div>
                </div>
            </div>

            <button class="spin-button" id="spinButton">Крутить колесо!</button>

            <div class="wheel-result" id="wheelResult">
                Нажмите "Крутить колесо", чтобы испытать удачу!
            </div>

            <div class="cooldown-info" id="cooldownInfo"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
    const wheel = document.getElementById('wheel');
    const wheelInner = document.getElementById('wheelInner');
    const wheelResultInner = document.getElementById('wheelResultInner');
    const spinButton = document.getElementById('spinButton');
    const wheelResult = document.getElementById('wheelResult');
    const cooldownInfo = document.getElementById('cooldownInfo');
    const debugInfo = document.getElementById('debugInfo');

    let isSpinning = false;
    let canSpin = true;

    // Призы в правильном порядке (по часовой стрелке)
    const prizes = [
        { text: '+50', type: 'add', amount: 50, display: '+50 🪙', color: '#FF6B6B' },
        { text: '+100', type: 'add', amount: 100, display: '+100 🪙', color: '#4ECDC4' },
        { text: '+250', type: 'add', amount: 250, display: '+250 🪙', color: '#45B7D1' },
        { text: '-50', type: 'subtract', amount: 50, display: '-50 🪙', color: '#96CEB4' },
        { text: '-100', type: 'subtract', amount: 100, display: '-100 🪙', color: '#FFEAA7' },
        { text: '-250', type: 'subtract', amount: 250, display: '-250 🪙', color: '#DDA0DD' },
        { text: 'x2', type: 'multiply', multiplier: 2, display: 'x2 БАЛАНС', color: '#98D8C8' },
        { text: 'x3', type: 'multiply', multiplier: 3, display: 'x3 БАЛАНС', color: '#F7DC6F' },
        { text: '÷2', type: 'divide', divider: 2, display: '÷2 БАЛАНС', color: '#BB8FCE' },
        { text: '10K!', type: 'jackpot', amount: 10000, display: 'ДЖЕКПОТ!', color: '#85C1E9' }
    ];

    // Создаем секции колеса через JavaScript
    function createWheelSections() {
        wheel.innerHTML = '';

        // Создаем градиент для колеса в правильном порядке
        const gradientStops = prizes.map((prize, index) => {
            const startAngle = index * 36;
            const endAngle = (index + 1) * 36;
            return `${prize.color} ${startAngle}deg ${endAngle}deg`;
        }).join(', ');

        wheel.style.background = `conic-gradient(${gradientStops})`;

        // Создаем сектора с текстом в ТОЧНОМ порядке
        prizes.forEach((prize, index) => {
            const section = document.createElement('div');
            section.className = 'wheel-section';
            section.dataset.sector = index;
            section.dataset.prize = prize.text;

            // Устанавливаем поворот для сектора
            const rotation = index * 36;
            section.style.transform = `rotate(${rotation}deg)`;

            const text = document.createElement('div');
            text.className = 'wheel-text';
            text.textContent = prize.text;
            text.style.color = '#333';
            text.style.fontWeight = 'bold';
            text.style.textShadow = '1px 1px 2px rgba(255,255,255,0.8)';

            // Поворачиваем текст чтобы он был читаемым
            const textRotation = 90 - (index * 36);
            text.style.transform = `translateY(-50%) rotate(${textRotation}deg)`;

            section.appendChild(text);
            wheel.appendChild(section);
        });

        console.log('Колесо создано. Порядок секторов:');
        prizes.forEach((p, i) => {
            console.log(`Сектор ${i}: ${p.text} (цвет: ${p.color})`);
        });
    }

    // Функция для вычисления угла остановки для сектора
    function calculateStopAngle(sector) {
        // СМЕЩЕНИЕ: стрелка указывает на предыдущий сектор
        // Поэтому добавляем 1 к сектору чтобы компенсировать
        const adjustedSector = (sector + 1) % 10;

        // Центр скорректированного сектора
        const sectorCenterAngle = (adjustedSector * 36) + 18;
        const fullRotations = 5 * 360;
        const stopAngle = fullRotations - sectorCenterAngle;

        debugInfo.innerHTML = `
            Нужный сектор: ${sector} (${prizes[sector].text})<br>
            Скорректированный: ${adjustedSector} (${prizes[adjustedSector].text})<br>
            Центр сектора: ${sectorCenterAngle}°<br>
            Стоп угол: ${stopAngle}°
        `;

        console.log(`Сектор ${sector} -> ${adjustedSector}: центр=${sectorCenterAngle}°, стоп=${stopAngle}°`);
        return stopAngle;
    }

    // Функция для проверки расположения секторов
    function checkWheelLayout() {
        console.log('=== ПРОВЕРКА РАСПОЛОЖЕНИЯ СЕКТОРОВ ===');
        const sections = document.querySelectorAll('.wheel-section');

        sections.forEach((section, index) => {
            const angle = index * 36;
            console.log(`Сектор ${index} (${prizes[index].text}): угол=${angle}°`);
        });
        console.log('=== КОНЕЦ ПРОВЕРКИ ===');
    }

    // Функция для создания конфетти
    function createConfetti() {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        const container = document.querySelector('.wheel-container');

        const oldConfetti = container.querySelectorAll('.confetti');
        oldConfetti.forEach(confetti => confetti.remove());

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 2 + 's';
            confetti.style.width = Math.random() * 10 + 5 + 'px';
            confetti.style.height = Math.random() * 10 + 5 + 'px';

            container.appendChild(confetti);

            setTimeout(() => {
                if (confetti.parentNode) {
                    confetti.remove();
                }
            }, 3000);
        }
    }

    // Функция для отображения результата в центре
    function showInnerResult(prize, isJackpot = false) {
        if (isJackpot) {
            wheelInner.className = 'wheel-inner jackpot-inner winner-animation';
            createConfetti();
        } else if (prize.type === 'multiply' && prize.multiplier >= 2) {
            wheelInner.className = 'wheel-inner big-win-inner winner-animation';
            createConfetti();
        } else if (prize.type === 'subtract' || prize.type === 'divide') {
            wheelInner.className = 'wheel-inner loss-inner winner-animation';
        } else {
            wheelInner.className = 'wheel-inner winner-animation';
        }

        wheelResultInner.innerHTML = `
            <span class="wheel-result-large">${prize.display}</span>
            <span class="wheel-result-small">${getPrizeDescription(prize)}</span>
        `;

        wheelInner.style.display = 'flex';

        setTimeout(() => {
            wheelInner.style.display = 'none';
        }, 5000);
    }

    // Функция для получения описания приза
    function getPrizeDescription(prize) {
        switch(prize.type) {
            case 'add': return `+${prize.amount} монет`;
            case 'subtract': return `-${prize.amount} монет`;
            case 'multiply': return `×${prize.multiplier}`;
            case 'divide': return `÷${prize.divider}`;
            case 'jackpot': return 'МЕГА ВЫИГРЫШ!';
            default: return '';
        }
    }

    // Функция для подсветки сектора
    function highlightSection(sector) {
        const sections = document.querySelectorAll('.wheel-section');
        sections.forEach(section => section.classList.remove('highlight'));

        const targetSection = Array.from(sections).find(section =>
            parseInt(section.dataset.sector) === sector
        );

        if (targetSection) {
            targetSection.classList.add('highlight');

            const sparkle = document.createElement('div');
            sparkle.className = 'wheel-sparkle';
            targetSection.appendChild(sparkle);

            setTimeout(() => {
                targetSection.classList.remove('highlight');
                if (sparkle.parentNode) {
                    sparkle.remove();
                }
            }, 3000);
        }
    }

    // Проверяем статус колеса
    function checkWheelStatus() {
        fetch('/api/wheel/status')
            .then(response => response.json())
            .then(data => {
                canSpin = data.can_spin;

                if (canSpin) {
                    spinButton.disabled = false;
                    spinButton.textContent = 'Крутить колесо!';
                    cooldownInfo.textContent = `Всего вращений: ${data.spins_count || 0}`;
                } else {
                    spinButton.disabled = true;
                    spinButton.textContent = 'Уже крутили сегодня';
                    if (data.next_spin_time) {
                        const nextSpin = new Date(data.next_spin_time * 1000);
                        cooldownInfo.textContent = `Следующее вращение: ${nextSpin.toLocaleString()}`;
                    }
                }
            })
            .catch(error => {
                console.error('Ошибка при проверке статуса:', error);
                cooldownInfo.textContent = 'Ошибка загрузки статуса';
                canSpin = true;
                spinButton.disabled = false;
            });
    }

    // Функция вращения колеса
    function spinWheel() {
        if (isSpinning || !canSpin) return;

        isSpinning = true;
        spinButton.disabled = true;
        spinButton.textContent = 'Крутится...';
        wheelResult.textContent = 'Колесо вращается...';
        wheelInner.style.display = 'none';

        // Сначала получаем результат с сервера
        fetch('/api/wheel/spin', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const prize = data.prize;
                const sector = data.sector;
                const isJackpot = prize.type === 'jackpot';

                console.log('СЕРВЕР ВЕРНУЛ сектор:', sector, 'приз:', prize.text);
                console.log('КЛИЕНТ ОЖИДАЕТ:', prizes[sector].text);

                // Проверяем соответствие
                if (prize.text !== prizes[sector].text) {
                    console.error('НЕСОВПАДЕНИЕ! Серверный приз не совпадает с клиентским');
                }

                // Сбрасываем трансформацию
                wheel.style.transition = 'none';
                wheel.style.transform = 'rotate(0deg)';

                // Даем время на сброс
                setTimeout(() => {
                    const stopAngle = calculateStopAngle(sector);

                    // Запускаем анимацию
                    wheel.style.transition = 'transform 4s cubic-bezier(0.2, 0.8, 0.3, 1)';
                    wheel.style.transform = `rotate(${stopAngle}deg)`;

                    // После остановки
                    setTimeout(() => {
                        highlightSection(sector);
                        showInnerResult(prizes[sector], isJackpot);

                        wheelResult.innerHTML = `
                            <strong>🎊 Результат:</strong> ${data.message}<br>
                            <strong>💰 Баланс:</strong> ${data.old_balance} → ${data.new_balance} 🪙<br>
                        `;

                        isSpinning = false;
                        setTimeout(checkWheelStatus, 2000);
                    }, 4000);
                }, 50);

            } else {
                wheelResult.textContent = data.message;
                isSpinning = false;
                checkWheelStatus();
            }
        })
        .catch(error => {
            console.error('Ошибка при вращении:', error);
            wheelResult.textContent = 'Ошибка соединения. Попробуйте позже.';
            isSpinning = false;
            checkWheelStatus();
        });
    }

    // Инициализация
    function initWheel() {
        createWheelSections();
        checkWheelLayout();

        checkWheelStatus();
        spinButton.addEventListener('click', spinWheel);
        wheelInner.style.display = 'none';
    }

    // Запускаем инициализацию
    initWheel();
});
    </script>
</body>
</html>
